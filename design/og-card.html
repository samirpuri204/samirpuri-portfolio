<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>OG card — Samir Puri</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        background: radial-gradient(circle at 34% 46%, #262626 0%, #0b0b0b 52%, #000 78%);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        color: #fff;
        position: relative;
      }
      .grid {
        position: absolute; inset: 0;
        background-image: linear-gradient(rgba(255,255,255,0.028) 1px, transparent 1px),
                          linear-gradient(90deg, rgba(255,255,255,0.028) 1px, transparent 1px);
        background-size: 64px 64px;
        mask-image: radial-gradient(circle at 50% 50%, #000 30%, transparent 78%);
      }
      .portrait {
        position: absolute; right: -30px; bottom: -96px;
        width: 520px; height: auto;
        filter: grayscale(1) contrast(1.05) brightness(0.92);
        opacity: 0.9;
        mask-image: linear-gradient(to left, #000 62%, transparent 100%),
                    linear-gradient(to top, #000 74%, transparent 100%);
        mask-composite: intersect;
        -webkit-mask-image: linear-gradient(to left, #000 62%, transparent 100%),
                    linear-gradient(to top, #000 74%, transparent 100%);
        -webkit-mask-composite: source-in;
      }
      .content {
        position: absolute; left: 72px; top: 50%; transform: translateY(-50%);
        max-width: 720px;
      }
      .eyebrow {
        display: inline-flex; align-items: center; gap: 10px;
        font-size: 17px; letter-spacing: 0.18em; text-transform: uppercase;
        color: #9ca3af; font-weight: 600; margin-bottom: 26px;
      }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: #e5e7eb; box-shadow: 0 0 14px rgba(255,255,255,.55); }
      h1 {
        font-size: 108px; line-height: 0.92; font-weight: 900; letter-spacing: -0.035em;
        text-transform: uppercase;
        background: linear-gradient(to bottom, #ffffff 12%, #d4d4d4 55%, #7a7a7a 100%);
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      .role { margin-top: 26px; font-size: 30px; color: #e5e7eb; letter-spacing: -0.01em; }
      .role em { font-style: italic; color: #9ca3af; font-weight: 300; }
      .foot {
        position: absolute; left: 72px; bottom: 46px; display: flex; align-items: center; gap: 18px;
        font-size: 20px; color: #9ca3af; letter-spacing: 0.02em;
      }
      .foot .u { color: #f3f4f6; font-weight: 600; }
      .rule { height: 1px; width: 120px; background: linear-gradient(to right, rgba(255,255,255,.42), transparent); }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <img class="portrait" src="../public/assets/samir-portrait.png" alt="">
    <div class="content">
      <div class="eyebrow"><span class="dot"></span> Portfolio</div>
      <h1>Samir<br>Puri</h1>
      <div class="role">Full-Stack <em>Developer</em> · Nepal</div>
    </div>
    <div class="foot">
      <span class="u">samirpuri.com.np</span>
      <span class="rule"></span>
      <span>Web · Android · AI</span>
    </div>
  </body>
</html>
